name: Deploy Pneutn

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Backend: SAM build + deploy ──────────────────────────────────────────
  # Runs on every push but exits early (no-op) when no backend files changed,
  # thanks to --no-fail-on-empty-changeset on the deploy step.
  # workflow_dispatch always forces a full deploy.
  deploy-backend:
    name: Deploy Lambda (SAM)
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # AMPLIFY_DOMAIN is optional — defaults to "" which keeps CORS open to *
      AMPLIFY_DOMAIN: ${{ secrets.AMPLIFY_DOMAIN || '' }}
    outputs:
      api_url: ${{ steps.sam-deploy.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need parent commit to diff against

      # On workflow_dispatch there is no commit to diff, so always deploy.
      - name: Force changed=true (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: changes-dispatch
        shell: bash
        run: echo "changed=true" >> "$GITHUB_OUTPUT"

      # On push, diff against parent commit to see if backend files changed.
      - name: Check for backend changes (push)
        if: github.event_name == 'push'
        id: changes-push
        shell: bash
        run: |
          if git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -q -E '^(backend/|\.github/workflows/deploy\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Merge outputs from the two steps above into one value downstream steps can use.
      - name: Set combined changed flag
        id: changes
        shell: bash
        run: |
          DISPATCH="${{ steps.changes-dispatch.outputs.changed }}"
          PUSH="${{ steps.changes-push.outputs.changed }}"
          if [ "$DISPATCH" = "true" ] || [ "$PUSH" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required deployment secrets
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          test -n "$AWS_REGION"            || { echo "Missing AWS_REGION secret.";            exit 1; }
          test -n "$AWS_ACCESS_KEY_ID"     || { echo "Missing AWS_ACCESS_KEY_ID secret.";     exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing AWS_SECRET_ACCESS_KEY secret."; exit 1; }
          # GEMINI_API_KEY and AMPLIFY_DOMAIN are optional — Lambda uses fallback narration without Gemini

      - name: Set up Python 3.11
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AWS SAM CLI
        if: steps.changes.outputs.changed == 'true'
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        if: steps.changes.outputs.changed == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Install arm64 manylinux wheels directly — no Docker, no --use-container.
      # --use-container was the root cause of the 1.5-hour job stall: it tries
      # to pull a large Lambda build container image on every run.
      - name: Build Lambda Layer (SymPy, NumPy, Google Gen AI SDK for arm64)
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p backend/layers/sympy-numpy/python
          pip install \
            --platform manylinux2014_aarch64 \
            --target backend/layers/sympy-numpy/python \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            --upgrade \
            -r backend/requirements.txt
          # Keep the deployment artifact well below Lambda's unzipped 250 MB
          # limit without removing installed-package metadata at runtime.
          LAYER_DIR="backend/layers/sympy-numpy/python"
          find "$LAYER_DIR" -type d -name "tests" -prune -exec rm -rf {} +
          find "$LAYER_DIR" -type d -name "testing" -prune -exec rm -rf {} +
          find "$LAYER_DIR" -type d -name "__pycache__" -prune -exec rm -rf {} +

      - name: SAM build
        if: steps.changes.outputs.changed == 'true'
        working-directory: backend
        # No --use-container: arm64 wheels already installed above with correct
        # platform flags. Container builder would stall pulling Docker images.
        run: sam build

      - name: SAM deploy
        if: steps.changes.outputs.changed == 'true'
        id: sam-deploy
        working-directory: backend
        shell: bash
        run: |
          # Build parameter overrides — only include AmplifyDomain if set
          PARAM_OVERRIDES="GeminiApiKey=${{ env.GEMINI_API_KEY }}"
          if [ -n "${{ env.AMPLIFY_DOMAIN }}" ]; then
            PARAM_OVERRIDES="$PARAM_OVERRIDES AmplifyDomain=${{ env.AMPLIFY_DOMAIN }}"
          fi

          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name pneutn-backend \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides "$PARAM_OVERRIDES"

          # Capture the API URL output for downstream consumers
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name pneutn-backend \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

  # ── Frontend: Vite build + lint — runs on every push ────────────────────
  # Amplify handles its own deployment from the Console; this job just
  # verifies the build compiles cleanly on every commit.
  build-frontend:
    name: Build Frontend (verify)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # VITE_API_BASE_URL is empty here — build still succeeds.
        # The real URL is injected by Amplify from its own env vars at deploy time.
        env:
          VITE_API_BASE_URL: ""
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint
