name: Deploy Pneuton

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Backend: SAM build + deploy ──────────────────────────────────────────
  deploy-backend:
    name: Deploy Lambda (SAM)
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
      AMPLIFY_DOMAIN: ${{ secrets.AMPLIFY_DOMAIN || vars.AMPLIFY_DOMAIN }}
    outputs:
      api_url: ${{ steps.sam-deploy.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate required deployment secrets
        shell: bash
        run: |
          test -n "$AWS_REGION" || { echo "Missing AWS_REGION secret or repository variable."; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Missing AWS_ACCESS_KEY_ID secret or repository variable."; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing AWS_SECRET_ACCESS_KEY secret or repository variable."; exit 1; }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Build the Lambda Layer (arm64 manylinux wheels) in a container
      # This produces backend/layers/sympy-numpy/python/  which SAM packages.
      - name: Build Lambda Layer (sympy + numpy for arm64)
        run: |
          mkdir -p backend/layers/sympy-numpy/python
          pip install \
            --platform manylinux2014_aarch64 \
            --target backend/layers/sympy-numpy/python \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            --upgrade \
            sympy numpy

      - name: SAM build
        working-directory: backend
        run: sam build --use-container

      - name: SAM deploy
        id: sam-deploy
        working-directory: backend
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name pneuton-backend \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              GeminiApiKey="${{ env.GEMINI_API_KEY }}" \
              AmplifyDomain="${{ env.AMPLIFY_DOMAIN }}"

          # Capture the API URL output for the frontend job
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name pneuton-backend \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

  # ── Frontend: Vite build — just verify it compiles (Amplify deploys itself)
  build-frontend:
    name: Build Frontend (verify)
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ needs.deploy-backend.outputs.api_url }}
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint
