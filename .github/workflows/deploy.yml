name: Deploy Pneutn

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Backend: SAM build + deploy ──────────────────────────────────────────
  # Only runs when backend source or this workflow file changes.
  deploy-backend:
    name: Deploy Lambda (SAM)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added + github.event.commits.*.removed), 'backend/') ||
      contains(toJson(github.event.commits.*.modified + github.event.commits.*.added + github.event.commits.*.removed), '.github/workflows/deploy.yml')
    env:
      AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
      AMPLIFY_DOMAIN: ${{ secrets.AMPLIFY_DOMAIN || vars.AMPLIFY_DOMAIN }}
    outputs:
      api_url: ${{ steps.sam-deploy.outputs.api_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate required deployment secrets
        shell: bash
        run: |
          test -n "$AWS_REGION" || { echo "Missing AWS_REGION secret or repository variable."; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo "Missing AWS_ACCESS_KEY_ID secret or repository variable."; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Missing AWS_SECRET_ACCESS_KEY secret or repository variable."; exit 1; }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Install arm64 manylinux wheels directly — no Docker, no --use-container.
      # --use-container was the root cause of the 1.5-hour job stall: it tries
      # to pull a large Lambda build container image on every run.
      - name: Build Lambda Layer (sympy + numpy for arm64)
        run: |
          mkdir -p backend/layers/sympy-numpy/python
          pip install \
            --platform manylinux2014_aarch64 \
            --target backend/layers/sympy-numpy/python \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            --upgrade \
            sympy numpy

      - name: SAM build
        working-directory: backend
        # No --use-container: arm64 wheels already installed above with correct
        # platform flags. Container builder would stall pulling Docker images.
        run: sam build

      - name: SAM deploy
        id: sam-deploy
        working-directory: backend
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name pneutn-backend \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides \
              GeminiApiKey="${{ env.GEMINI_API_KEY }}" \
              AmplifyDomain="${{ env.AMPLIFY_DOMAIN }}"

          # Capture the API URL output for downstream consumers
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name pneutn-backend \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

  # ── Frontend: Vite build + lint — runs on every push ────────────────────
  # Amplify handles its own deployment from the Console; this job just
  # verifies the build compiles cleanly on every commit.
  build-frontend:
    name: Build Frontend (verify)
    runs-on: ubuntu-latest
    # Run independently — don't block on backend deploy for frontend-only pushes
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        # VITE_API_BASE_URL may be empty here — that's fine, the build still
        # succeeds and the real URL is injected by Amplify from its env vars.
        env:
          VITE_API_BASE_URL: ""
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint
